```html
{% extends "base.html" %}

{% block title %}Talabalar{% endblock %}

{% block content %}

<section class="students-page">

    <div class="page-head">
        <h1>🎓 Talabalar</h1>
        <p>Muzey Lab platformasidagi talabalar ro‘yxati</p>
    </div>

    <div class="students-grid">

        {% for s in students %}
        <div class="student-card">

            <img src="{{ s.image }}" alt="{{ s.name }}">

            <div class="student-info">
                <h3>{{ s.name }}</h3>

                <p>{{ s.grade }}</p>

                <p>{{ s.direction }}</p>

                <p><strong>Ball:</strong> {{ s.score }}</p>

                <a href="/student/{{ s.id }}" class="btn">
                    Profilni ko‘rish
                </a>
            </div>

        </div>
        {% endfor %}

    </div>

</section>

{% endblock %}
```
